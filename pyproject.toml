[project]
name = "remediation-guardrails"
version = "1.0.0"
description = "Testbed measuring the safety/utility tradeoff of a deterministic verification gate for LLM-driven auto-remediation"
license = { text = "MIT" }
authors = [
  { name = "Abhishek Prasanna" },
  { name = "Dharani Prasad S" },
  { name = "Kartavyakumar Nitinbhai Patel" },
]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rg = "rg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
